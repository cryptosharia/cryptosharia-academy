<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="CryptoSharia Academy — Platform e-learning edukasi crypto berbasis Syariah terbesar di Indonesia. Pelajari ratusan materi, raih sertifikat, dan bangun karir di ekosistem kripto halal." />
		<meta name="theme-color" content="#EA580C" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<title>CryptoSharia Academy | Platform Edukasi Crypto Syariah #1</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function() {
				var t = localStorage.getItem('cryptosharia-theme') || 'system';
				var d = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
				if (d === 'dark') document.documentElement.classList.add('dark');
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
